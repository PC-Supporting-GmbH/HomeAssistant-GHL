name: aaa_PCS Create Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: "Increase current latest version"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      release_version:
        description: "Optional exact release version, e.g. v1.1.2"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release:
    if: github.actor == 'Stefan-PCS'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.release_version }}
          VERSION_INCREMENT: ${{ inputs.version_increment }}
        run: |
          if [[ -n "$MANUAL_VERSION" ]]; then
            RELEASE_VERSION="$MANUAL_VERSION"
            echo "Using manually specified version: $RELEASE_VERSION"
          else
            CURRENT_VERSION="$(gh release view --json tagName --jq '.tagName')"

            if [[ ! "$CURRENT_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release has an invalid version format: $CURRENT_VERSION"
              echo "Expected format: v1.2.3"
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            case "$VERSION_INCREMENT" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              *)
                echo "Invalid version increment: $VERSION_INCREMENT"
                exit 1
                ;;
            esac

            RELEASE_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

            echo "Current latest release: $CURRENT_VERSION"
            echo "Version increment: $VERSION_INCREMENT"
            echo "Calculated release version: $RELEASE_VERSION"
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Validate version
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v1.2.3"
            exit 1
          fi

      - name: Check whether tag already exists
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

      - name: Check manifest version
        shell: bash
        run: |
          EXPECTED_VERSION="${RELEASE_VERSION#v}"

          ACTUAL_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/pcs_ghl/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          print(data["version"])
          PY
          )"

          echo "Current manifest version: $ACTUAL_VERSION"
          echo "Expected manifest version: $EXPECTED_VERSION"

          if [[ "$ACTUAL_VERSION" == "$EXPECTED_VERSION" ]]; then
            echo "Manifest already contains the correct version."
            echo "MANIFEST_UPDATE_REQUIRED=false" >> "$GITHUB_ENV"
          else
            echo "Manifest version must be updated."
            echo "MANIFEST_UPDATE_REQUIRED=true" >> "$GITHUB_ENV"
          fi

      - name: Update manifest version
        if: env.MANIFEST_UPDATE_REQUIRED == 'true'
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          MANIFEST_VERSION="${VERSION#v}"
          export MANIFEST_VERSION

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/pcs_ghl/manifest.json")
          version = os.environ["MANIFEST_VERSION"]

          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version

          path.write_text(
              json.dumps(data, indent="\t", ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit manifest version
        if: env.MANIFEST_UPDATE_REQUIRED == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_components/pcs_ghl/manifest.json
          git commit -m "Adapt manifest to Release Version"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create tag
        shell: bash
        run: |
          git tag "$RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${RELEASE_VERSION}^")"

          RELEASE_SERIES="${RELEASE_VERSION#v}"
          RELEASE_SERIES="${RELEASE_SERIES%.*}"

          echo "Previous tag: $PREVIOUS_TAG"

          if [[ "${RELEASE_VERSION##*.}" != "0" ]]; then
            gh release view --json tagName,body,isDraft,isPrerelease > previous-release.json

            python - <<'PYNOTES'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          previous = json.loads(Path("previous-release.json").read_text(encoding="utf-8"))
          previous_version = previous["tagName"]
          current_parts = tuple(int(part) for part in version.removeprefix("v").split("."))
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", previous_version):
              raise SystemExit("Previous release has an invalid version format")
          previous_parts = tuple(int(part) for part in previous_version[1:].split("."))
          if (
              previous["isDraft"]
              or previous["isPrerelease"]
              or previous_parts[:2] != current_parts[:2]
              or previous_parts >= current_parts
          ):
              raise SystemExit("Patch notes require an earlier published release in the same release series")

          body = previous["body"].replace("\r\n", "\n")
          fixes_heading = re.search(r"^###\s+Fixes(?:\s+in\s+[^\n:]+)?\s*:?[ \t]*$", body, re.MULTILINE)
          if fixes_heading is None:
              raise SystemExit("Previous release has no recognizable Fixes heading; notes were not overwritten")
          highlights = body[:fixes_heading.start()].rstrip()
          series = ".".join(str(part) for part in current_parts[:2])
          highlights = re.sub(
              r"^###\s+(?:Highlights of the [^\n]+ release series|Noteworthy Changes[^\n]*)[ \t]*$",
              f"### Highlights of the {series} release series",
              highlights,
              count=1,
              flags=re.MULTILINE,
          )
          commits = subprocess.check_output(
              [
                  "git", "log", f"{previous_version}..{version}",
                  "--format=- %s", "--invert-grep",
                  "--grep=^Adapt manifest to Release Version$",
              ],
              text=True,
              encoding="utf-8",
          ).rstrip()
          notes = f"{highlights}\n\n### Fixes in {version}\n\n{commits}\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PYNOTES
          else
            {
              echo "### Highlights of the $RELEASE_SERIES release series"
              echo ""
              git log "${PREVIOUS_TAG}..${RELEASE_VERSION}" \
                --format='- %s' \
                --invert-grep \
                --grep='^Adapt manifest to Release Version$'
              echo ""
              echo "### Fixes in $RELEASE_VERSION"
            } > release-notes.md
          fi

          echo ""
          echo "Generated release notes:"
          cat release-notes.md

      - name: Prepare integration ZIP
        shell: bash
        run: |
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("custom_components/pcs_ghl")
          with ZipFile("pcs_ghl.zip", "w", compression=ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=path.relative_to(source))
          PYZIP

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" pcs_ghl.zip \
            --draft \
            --title "$RELEASE_VERSION" \
            --verify-tag \
            --notes-file release-notes.md

      - name: Show release link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_URL="$(gh release view "$RELEASE_VERSION" --json url --jq '.url')"

          echo ""
          echo "Release preparation completed successfully."
          echo "Please finalize the release and enter the release notes:"
          echo "$RELEASE_URL"

          {
            echo "## Release preparation completed successfully"
            echo ""
            echo "Prepared release: **$RELEASE_VERSION**"
            echo ""
            echo "Please finalize the release and enter the release notes:"
            echo ""
            echo "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"