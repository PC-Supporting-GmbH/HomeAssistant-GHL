name: aaa_PCS Create Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: "Increase current latest version"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

      release_version:
        description: "Optional exact release version, e.g. v1.1.2"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release:
    if: github.actor == 'Stefan-PCS'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.release_version }}
          VERSION_INCREMENT: ${{ inputs.version_increment }}
        run: |
          if [[ -n "$MANUAL_VERSION" ]]; then
            RELEASE_VERSION="$MANUAL_VERSION"
            echo "Using manually specified version: $RELEASE_VERSION"
          else
            CURRENT_VERSION="$(gh release view --json tagName --jq '.tagName')"

            if [[ ! "$CURRENT_VERSION" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release has an invalid version format: $CURRENT_VERSION"
              echo "Expected format: v1.2.3"
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            case "$VERSION_INCREMENT" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              *)
                echo "Invalid version increment: $VERSION_INCREMENT"
                exit 1
                ;;
            esac

            RELEASE_VERSION="v${MAJOR}.${MINOR}.${PATCH}"

            echo "Current latest release: $CURRENT_VERSION"
            echo "Version increment: $VERSION_INCREMENT"
            echo "Calculated release version: $RELEASE_VERSION"
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Validate version
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v1.2.3"
            exit 1
          fi

      - name: Check whether tag already exists
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

      - name: Update manifest version
        shell: bash
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          MANIFEST_VERSION="${VERSION#v}"
          export MANIFEST_VERSION

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("custom_components/hacs_ghl/manifest.json")
          version = os.environ["MANIFEST_VERSION"]

          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version

          path.write_text(
              json.dumps(data, indent="\t", ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit manifest version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add custom_components/hacs_ghl/manifest.json
          git commit -m "Adapt manifest to Release Version"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create tag
        shell: bash
        run: |
          git tag "$RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --draft \
            --title "$RELEASE_VERSION" \
            --verify-tag

      - name: Show release link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_URL="$(gh release view "$RELEASE_VERSION" --json url --jq '.url')"

          echo ""
          echo "Release preparation completed successfully."
          echo "Please finalize the release and enter the release notes:"
          echo "$RELEASE_URL"

          {
            echo "## Release preparation completed successfully"
            echo ""
            echo "Prepared release: **$RELEASE_VERSION**"
            echo ""
            echo "Please finalize the release and enter the release notes:"
            echo ""
            echo "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"